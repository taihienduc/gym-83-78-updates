name: Publish app updates

on:
  push:
    branches: [main]
    paths:
      - "release-site/**"
      - ".github/workflows/deploy-updates.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: release-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
